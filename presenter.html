<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Presenter · Nauman Riaz</title><link rel="icon" href="data:,"><link rel="stylesheet" href="presenter-window.css?v=2"><style>
html,body{height:100%;overflow:hidden}#current-slide,#upcoming-slide,#speaker-controls{position:absolute;box-sizing:border-box}#current-slide iframe,#upcoming-slide iframe{width:100%;height:100%}.overlay-element{position:absolute;left:10px;top:10px;padding:0 10px}#speaker-controls{overflow:auto}.speaker-controls-time{border-bottom:1px solid #c8d0c4}.clock{order:1}.note-speech{color:#203c37}#presenter-connection{position:absolute;left:32%;top:140px;font-size:20px;line-height:1.5;padding:12px;z-index:10;background:#f3f0e8}#presenter-connection[hidden]{display:none}#presenter-references:not([open]){display:none}button[hidden]{display:none!important}
</style></head><body class="colloquium-presenter" data-speaker-layout="default">
<nav id="presenter-toolbar" aria-label="Presenter controls"><div class="presenter-top"><div><span class="presenter-brand">Your presenter window · Keep this window private</span><span class="presenter-title" id="presenter-title"></span></div><span class="presenter-position" id="presenter-position" aria-live="polite">Connecting…</span></div><div class="presenter-actions"><button id="presenter-previous">← Previous</button><button id="presenter-next" class="presenter-primary">Next →</button><select id="presenter-slide" aria-label="Jump to slide"></select><button id="presenter-map">Research map</button><button id="presenter-closing">Closing</button><button id="presenter-reference-button">References</button><button id="presenter-focus">Focus notes</button><button id="presenter-mode">Return to rehearsal</button></div></nav>
<p id="presenter-connection">Connecting to your audience window…</p>
<div id="current-slide"><iframe title="Current audience slide" tabindex="-1"></iframe></div>
<div id="upcoming-slide"><span class="overlay-element label">Upcoming</span><iframe title="Upcoming audience step" tabindex="-1"></iframe></div>
<main id="speaker-controls"><div class="speaker-controls-time"><span class="clock" id="presenter-clock"></span><span class="timer" id="presenter-timer" title="Elapsed time · click to reset" role="button" tabindex="0">00:00</span></div><div class="speaker-controls-notes"><div class="value"></div></div></main>
<dialog id="presenter-references" aria-label="Paper references"></dialog>
<script src="presenter-window.js?v=3"></script></body></html>
